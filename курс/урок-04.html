    <h1>Урок 4: Условия и циклы</h1>
    
    <p><code>если</code> / <code>иначе</code>, циклы <code>пока</code> и <code>для … в …</code>.</p>
    <div class="code-block">
      <pre><code>функция главная() {
    для и в 0..5 {
        ПечатьЧисло(и)
    }
}</code></pre>
      <div class="btn-row"><button type="button" onclick="runCode(`функция главная() {\n    для и в 0..5 {\n        ПечатьЧисло(и)\n    }\n}`)">Запустить</button></div>
    </div>

    
    <div class="task-panel" data-task="4">
      <h3>Практика: задача 4</h3>
      <p>Отредактируйте код и нажмите «Проверить».</p>
      <textarea class="task-code" id="код-задачи-4">функция главная() {
    н = 4
    если н % 2 == 0 {
        ПечатьСтроки("чёт")
    } иначе {
        ПечатьСтроки("нечёт")
    }
}</textarea>
      <div class="actions">
        <button type="button" onclick="runCode(document.getElementById('код-задачи-4').value)">Запустить</button>
        <button type="button" onclick="запустить_и_проверить(4)">Проверить</button>
      </div>
      <div class="task-result" id="результат-задачи-4"></div>
    </div>
