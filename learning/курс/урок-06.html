    <h1>Урок 6: Аннотации</h1>
    
    <p>Аннотации начинаются с <code>@</code> и задают подсказки компилятору / runtime.</p>
    <div class="code-block">
      <pre><code>@ускорить(уровень = 2)
функция обработать(х) {
    возврат(х)
}</code></pre>
      <button type="button" onclick="runCode(`@ускорить(уровень = 2)\nфункция обработать(х) {\n    возврат(х)\n}\nфункция главная() {\n    ПечатьЧисло(обработать(1))\n}`)">Запустить</button>
    </div>
    <p>Примеры: <code>@кэшировать</code>, <code>@шифровать</code>, <code>@тест</code>.</p>
