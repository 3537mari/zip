[package]
name = "zip-vm-ios"
version = "7.2.0"
edition = "2021"
description = "C-API ZIP-VM для iOS (static library + XCFramework)"
license = "MIT"

[lib]
name = "zip_vm_ios"
crate-type = ["staticlib", "rlib"]

[dependencies]
zip-vm = { path = "../zip-vm", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
