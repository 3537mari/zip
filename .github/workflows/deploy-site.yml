name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - "веб-сайт/**"
      - "zipc/src/wasm.rs"
      - "zipc/Cargo.toml"
      - "zipc/Cargo.lock"
      - "zip-vm/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM playground (zip-vm + zipc)
        run: |
          cargo install wasm-bindgen-cli --version 0.2.100 --locked --force
          # Полная VM: компиляция + запуск в браузере
          cargo build --lib --release \
            --target wasm32-unknown-unknown \
            --no-default-features --features wasm \
            --manifest-path zip-vm/Cargo.toml
          wasm-bindgen --target web --out-dir веб-сайт/wasm \
            zip-vm/target/wasm32-unknown-unknown/release/zip_vm.wasm
          # Совместимость: старый zipc compile-only
          cargo build --lib --target wasm32-unknown-unknown --features wasm --release \
            --manifest-path zipc/Cargo.toml
          wasm-bindgen --target web --out-dir веб-сайт/wasm \
            zipc/target/wasm32-unknown-unknown/release/zipc.wasm
          ls -lh веб-сайт/wasm/

      # Bundler ломается на кириллическом пути — собираем из ASCII-копии
      - name: Prepare ASCII build directory
        run: |
          rm -rf website
          cp -a веб-сайт website
          rm -f website/Gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false
          working-directory: website

      - name: Build Jekyll site
        working-directory: website
        run: |
          gem install bundler -v 2.4.19
          bundle install
          bundle exec jekyll build
          ls -la _site | head

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/_site
