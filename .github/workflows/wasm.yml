name: WASM Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked --force

      - name: Build zip-vm for WASM
        run: |
          cargo build --lib --release \
            --target wasm32-unknown-unknown \
            --no-default-features --features wasm \
            --manifest-path zip-vm/Cargo.toml

      - name: Run wasm-bindgen
        run: |
          wasm-bindgen \
            --target web \
            --out-dir веб-сайт/wasm \
            zip-vm/target/wasm32-unknown-unknown/release/zip_vm.wasm
          ls -lh веб-сайт/wasm/zip_vm_bg.wasm
          # Размер < 5 МБ
          python3 - <<'PY'
          from pathlib import Path
          p = Path("веб-сайт/wasm/zip_vm_bg.wasm")
          size = p.stat().st_size
          print(f"size={size}")
          assert size < 5 * 1024 * 1024, size
          PY

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Test in headless Chrome
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          cd веб-сайт/wasm
          python3 -m http.server 8765 &
          sleep 2
          # ASCII-имя копии — проще для логов и curl
          cp тест_wasm.html test_wasm.html
          chrome --headless=new --disable-gpu \
            --no-sandbox \
            --virtual-time-budget=20000 \
            --dump-dom \
            http://localhost:8765/test_wasm.html > /tmp/wasm_out.html
          # Сохраняем как UTF-8 явно
          python3 - <<'PY'
          from pathlib import Path
          raw = Path("/tmp/wasm_out.html").read_bytes()
          text = raw.decode("utf-8", errors="replace")
          print(text[text.find("<pre"): text.find("</pre>") + 6] if "<pre" in text else text[:2000])
          if "OK WASM-tests passed" not in text:
              raise SystemExit("WASM-тесты провалились: нет OK WASM-tests passed")
          if "t3_has_hello=false" in text:
              raise SystemExit("WASM-тесты: кириллица в строках сломана")
          if "= 120" not in text or "= 5" not in text:
              raise SystemExit("WASM-тесты: нет ожидаемых результатов")
          print("OK WASM CI passed")
          PY

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            веб-сайт/wasm/zip_vm.js
            веб-сайт/wasm/zip_vm_bg.wasm
            веб-сайт/wasm/zip_vm.d.ts
            веб-сайт/wasm/тест_wasm.html
