[features]
default = []
# LLVM IR + clang -O3 (встроенный эмиттер llvm_ir.rs).
# Опционально: inkwell при наличии полного LLVM SDK:
#   LLVM_SYS_221_PREFIX=... cargo build --release --features llvm,inkwell-llvm
llvm = []
inkwell-llvm = ["dep:inkwell"]
# Онлайн-плейграунд: wasm-pack build --target web --features wasm
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip-vm = { path = "../zip-vm" }
wasm-bindgen = { version = "=0.2.100", optional = true }
js-sys = { version = "0.3", optional = true }
# Полный SDK LLVM 22+ (не входит в winget runtime). См. docs / llvm_ir.rs.
inkwell = { version = "0.10", features = ["llvm22-1"], optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "производительность"
harness = false

[[bench]]
name = "компиляция"
harness = false

