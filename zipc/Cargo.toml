[package]
name = "zipc"
version = "0.1.0"
edition = "2021"
description = "Компилятор языка ZIP (Zero-Immunity-Pulse)"
license = "MIT"

[lib]
name = "zipc"
path = "src/lib.rs"

[[bin]]
name = "zipc"
path = "src/главное.rs"

[[test]]
name = "тест_лексики"
path = "../tests/тест_лексики.rs"

[[test]]
name = "тест_парсера"
path = "../tests/тест_парсера.rs"

[[test]]
name = "тест_промежутка"
path = "../tests/тест_промежутка.rs"

[[test]]
name = "тест_нативного"
path = "../tests/тест_нативного.rs"

[[test]]
name = "тест_управления"
path = "../tests/тест_управления.rs"

[[test]]
name = "тест_печати"
path = "../tests/тест_печати.rs"

[[test]]
name = "тест_пластичности"
path = "../tests/тест_пластичности.rs"

[[test]]
name = "тест_владения"
path = "../tests/тест_владения.rs"

[[test]]
name = "тест_comptime"
path = "../tests/тест_comptime.rs"

[features]
default = []
# LLVM IR + clang -O3 (встроенный эмиттер llvm_ir.rs).
# Опционально: inkwell при наличии полного LLVM SDK:
#   LLVM_SYS_221_PREFIX=... cargo build --release --features llvm,inkwell-llvm
llvm = []
inkwell-llvm = ["dep:inkwell"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
# Полный SDK LLVM 22+ (не входит в winget runtime). См. docs / llvm_ir.rs.
inkwell = { version = "0.10", features = ["llvm22-1"], optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
