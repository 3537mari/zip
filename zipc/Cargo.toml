[package]
name = "zipc"
version = "0.1.0"
edition = "2021"
description = "Компилятор языка ZIP (Zero-Immunity-Pulse)"
license = "MIT"

[lib]
name = "zipc"
path = "src/lib.rs"

[[bin]]
name = "zipc"
path = "src/главное.rs"

[[test]]
name = "тест_лексики"
path = "../tests/тест_лексики.rs"

[[test]]
name = "тест_парсера"
path = "../tests/тест_парсера.rs"

[[test]]
name = "тест_промежутка"
path = "../tests/тест_промежутка.rs"

[[test]]
name = "тест_нативного"
path = "../tests/тест_нативного.rs"

[[test]]
name = "тест_управления"
path = "../tests/тест_управления.rs"

[[test]]
name = "тест_печати"
path = "../tests/тест_печати.rs"

[[test]]
name = "тест_пластичности"
path = "../tests/тест_пластичности.rs"

[[test]]
name = "тест_владения"
path = "../tests/тест_владения.rs"

[[test]]
name = "тест_comptime"
path = "../tests/тест_comptime.rs"

[[test]]
name = "тест_гласных"
path = "../tests/тест_гласных.rs"

[[test]]
name = "тест_итераторов"
path = "../tests/тест_итераторов.rs"

[[test]]
name = "тест_комплементарности"
path = "../tests/тест_комплементарности.rs"

[[test]]
name = "тест_эпигенетики"
path = "../tests/тест_эпигенетики.rs"

[[test]]
name = "тест_опциональных"
path = "../tests/тест_опциональных.rs"

[[test]]
name = "тест_диапазон_copy"
path = "../tests/тест_диапазон_copy.rs"

[[test]]
name = "тест_assert_matches"
path = "../tests/тест_assert_matches.rs"

[[test]]
name = "тест_ffi_overload"
path = "../tests/тест_ffi_overload.rs"

[[test]]
name = "тест_ассоциаций"
path = "../tests/тест_ассоциаций.rs"

[[test]]
name = "тест_корней"
path = "../tests/тест_корней.rs"

[[test]]
name = "тест_ttl"
path = "../tests/тест_ttl.rs"

[[test]]
