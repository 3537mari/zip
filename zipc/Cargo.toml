[package]
name = "zipc"
version = "0.1.0"
edition = "2021"
description = "Компилятор языка ZIP (Zero-Immunity-Pulse)"
license = "MIT"

[lib]
name = "zipc"
path = "src/lib.rs"

[[bin]]
name = "zipc"
path = "src/main.rs"

[[test]]
name = "тест_лексики"
path = "../tests/тест_лексики.rs"

[[test]]
name = "тест_парсера"
path = "../tests/тест_парсера.rs"

[[test]]
name = "тест_промежутка"
path = "../tests/тест_промежутка.rs"

[[test]]
name = "тест_нативного"
path = "../tests/тест_нативного.rs"

[features]
default = []
# Полноценный LLVM через inkwell требует LLVM 17 в системе:
#   LLVM_SYS_170_PREFIX=... cargo test --features llvm
llvm = ["dep:inkwell"]

[dependencies]
inkwell = { version = "0.4", features = ["llvm17-0"], optional = true }
