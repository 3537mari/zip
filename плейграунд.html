<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZIP Playground</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d9cf0;
      --ok: #3ecf8e;
      --err: #f07178;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      font-family: "Segoe UI", "IBM Plex Sans", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    h1 { font-weight: 650; letter-spacing: -0.02em; margin: 0 0 8px; }
    p { color: var(--muted); margin-top: 0; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .col { flex: 1 1 320px; min-width: 280px; }
    textarea, #out {
      width: 100%; height: 420px;
      background: var(--panel); color: var(--text);
      border: 1px solid #2a3a52; border-radius: 8px;
      padding: 12px; font-family: "Cascadia Code", Consolas, monospace;
      font-size: 14px; line-height: 1.45;
    }
    #out { white-space: pre-wrap; overflow: auto; }
    button {
      margin-top: 12px; padding: 10px 18px;
      background: var(--accent); color: #041018; border: 0;
      border-radius: 8px; font-weight: 650; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    .status { margin-top: 8px; font-size: 13px; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>ZIP Playground</h1>
  <p>Онлайн-разбор ZIP (WASM). <a href="./">← на сайт</a></p>
  <div class="row">
    <div class="col">
      <h3>Исходник</h3>
      <textarea id="code">функция главная() {
    ПечатьСтроки("Привет, мир!")
}
</textarea>
      <button id="btn" onclick="run()">Скомпилировать</button>
      <div class="status" id="status">Загрузка WASM…</div>
    </div>
    <div class="col">
      <h3>Вывод</h3>
      <div id="out"></div>
    </div>
  </div>
  <script type="module">
    const status = document.getElementById("status");
    const out = document.getElementById("out");
    let api = null;

    async function load() {
      try {
        const mod = await import("./wasm/zipc.js");
        await mod.default();
        api = mod;
        status.textContent = "ZIP " + (mod.версия ? mod.версия() : "?") + " · WASM готов";
      } catch (e) {
        status.textContent = "WASM не собран — fallback-анализатор (лексер JS)";
        api = null;
        console.warn(e);
      }
    }

    function fallback(src) {
      const lines = src.split(/\n/).filter(Boolean).length;
      const hasMain = /функция\s+главная/.test(src);
      const hasPrint = /ПечатьСтроки|печать_строки/.test(src);
      return [
        "Fallback (без WASM)",
        "Строк: " + lines,
        "главная: " + (hasMain ? "да" : "нет"),
        "печать: " + (hasPrint ? "да" : "нет"),
        "",
        "Соберите WASM:",
        "  cd zipc && wasm-pack build --target web --features wasm --out-dir ../веб-сайт/wasm",
      ].join("\n");
    }

    window.run = function () {
      const src = document.getElementById("code").value;
      try {
        if (api && api.скомпилировать) {
          out.textContent = api.скомпилировать(src);
        } else {
          out.textContent = fallback(src);
        }
      } catch (e) {
        out.textContent = "Ошибка: " + e;
      }
    };

    await load();
  </script>
</body>
</html>
