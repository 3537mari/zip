# Кросс-линкеры для ARM64 / RISC-V.
# Ubuntu CI: apt install gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu
# На Windows-хосте Linux-target обычно собирается в GitHub Actions.

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.riscv64gc-unknown-linux-gnu]
linker = "riscv64-linux-gnu-gcc"
