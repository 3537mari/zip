[package]
name = "zipm"
version = "0.1.0"
edition = "2021"
description = "ЗИПМ — менеджер пакетов ZIP"
license = "MIT"

[[bin]]
name = "zipm"
path = "src/главное.rs"
# Кириллический алиас: scripts/создать_алиасы.ps1 → зипм.exe (hard link)

[[test]]
name = "тест_зипм"
path = "tests/тест_зипм.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
sha2 = "0.10"
tar = "0.4"
flate2 = "1.0"
ureq = { version = "2.9", default-features = true }

[dev-dependencies]
tempfile = "3"
