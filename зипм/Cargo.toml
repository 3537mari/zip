[package]
name = "zipm"
version = "0.1.0"
edition = "2021"
description = "ЗИПМ — менеджер пакетов ZIP"
license = "MIT"

[[bin]]
name = "zipm"
path = "src/главное.rs"

# Cyrillic alias (Windows/Unix with UTF-8 FS)
[[bin]]
name = "зипм"
path = "src/главное.rs"

[[test]]
name = "тест_зипм"
path = "tests/тест_зипм.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
sha2 = "0.10"
tar = "0.4"
flate2 = "1.0"

[dev-dependencies]
tempfile = "3"
