[package]
name = "zip-vm"
version = "0.1.0"
edition = "2021"
description = "Виртуальная машина байт-кода ZIP (.zipc)"
license = "MIT"

[lib]
name = "zip_vm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zip-vm"
path = "src/главное.rs"
required-features = ["cli"]

[[test]]
name = "тест_vm"
path = "tests/тест_vm.rs"

[[test]]
name = "тест_пластичности_vm"
path = "tests/тест_пластичности_vm.rs"

[[test]]
name = "тест_миелинизации"
path = "tests/тест_миелинизации.rs"

[[test]]
name = "тест_байткода_v3"
path = "tests/тест_байткода_v3.rs"

[[test]]
name = "тест_исполнителя_v3"
path = "tests/тест_исполнителя_v3.rs"

[[test]]
name = "тест_vm_v3_полный"
path = "tests/тест_vm_v3_полный.rs"

[[test]]
name = "тест_runtime_builtins"
path = "tests/тест_runtime_builtins.rs"

[[test]]
name = "тест_массивов_vm"
path = "tests/тест_массивов_vm.rs"

[[test]]
name = "тест_указателей_vm"
path = "tests/тест_указателей_vm.rs"

[[test]]
name = "тест_arm64"
path = "tests/тест_arm64.rs"

[[test]]
name = "тест_riscv"
path = "tests/тест_riscv.rs"

[[test]]
name = "тест_windows_arm"
path = "tests/тест_windows_arm.rs"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
sha2 = "0.10"
hex = "0.4"
zip-crypto = { path = "../zip-crypto" }
wasm-bindgen = { version = "=0.2.100", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
libloading = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
