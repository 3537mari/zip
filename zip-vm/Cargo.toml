[package]
name = "zip-vm"
version = "0.1.0"
edition = "2021"
description = "Виртуальная машина байт-кода ZIP (.zipc)"
license = "MIT"

[lib]
name = "zip_vm"
path = "src/lib.rs"

[[bin]]
name = "zip-vm"
path = "src/главное.rs"

[[test]]
name = "тест_vm"
path = "tests/тест_vm.rs"

[[test]]
name = "тест_пластичности_vm"
path = "tests/тест_пластичности_vm.rs"

[[test]]
name = "тест_миелинизации"
path = "tests/тест_миелинизации.rs"

[[test]]
name = "тест_байткода_v3"
path = "tests/тест_байткода_v3.rs"

[[test]]
name = "тест_исполнителя_v3"
path = "tests/тест_исполнителя_v3.rs"

[[test]]
name = "тест_vm_v3_полный"
path = "tests/тест_vm_v3_полный.rs"

[[test]]
name = "тест_runtime_builtins"
path = "tests/тест_runtime_builtins.rs"

[[test]]
name = "тест_массивов_vm"
path = "tests/тест_массивов_vm.rs"

[[test]]
name = "тест_указателей_vm"
path = "tests/тест_указателей_vm.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"
