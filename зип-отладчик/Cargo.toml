[package]
name = "zip-debugger"
version = "0.1.0"
edition = "2021"
description = "ЗИП-отладчик — Debug Adapter Protocol для ZIP"
license = "MIT"

[[bin]]
name = "zip-debugger"
path = "src/главное.rs"

[[bin]]
name = "зип-отладчик"
path = "src/главное.rs"

[dependencies]
dap = "0.4.1-alpha1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
zipc = { path = "../zipc" }
