[package]
name = "zip-profile"
version = "0.1.0"
edition = "2021"
description = "ЗИП-профиль — профилировщик производительности для ZIP"
license = "MIT"

[[bin]]
name = "zip-profile"
path = "src/главное.rs"
# Кириллический алиас: scripts/создать_алиасы.ps1 → зип-профиль.exe (hard link)

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zipc = { path = "../zipc" }
inferno = "0.11"
