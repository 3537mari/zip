<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>ZIP WASM — тесты</title>
</head>
<body>
  <h1>Тесты ZIP WASM</h1>
  <pre id="лог"></pre>

  <script type="module">
    import init, {
      compileAndRun,
      versionZip,
    } from "./zip_vm.js";

    const лог = document.getElementById("лог");
    function write(s) {
      лог.textContent += s + "\n";
    }

    // Юникод-эскейпы — чтобы тест не зависел от кодировки HTML на диске.
    const привет = "\u041f\u0440\u0438\u0432\u0435\u0442 \u0438\u0437 WASM!";

    async function run() {
      await init();
      write(`ZIP v${versionZip()}`);

      write("--- Тест 1: пустая программа ---");
      const t1 = compileAndRun("\u0444\u0443\u043d\u043a\u0446\u0438\u044f \u0433\u043b\u0430\u0432\u043d\u0430\u044f() { \u0432\u043e\u0437\u0432\u0440\u0430\u0442(0) }");
      write(t1);

      write("--- Тест 2: 2+3 ---");
      const t2 = compileAndRun("\u0444\u0443\u043d\u043a\u0446\u0438\u044f \u0433\u043b\u0430\u0432\u043d\u0430\u044f() { \u0432\u043e\u0437\u0432\u0440\u0430\u0442(2 + 3) }");
      write(t2);

      write("--- Тест 3: строка ---");
      const t3 = compileAndRun(
        "\u0444\u0443\u043d\u043a\u0446\u0438\u044f \u0433\u043b\u0430\u0432\u043d\u0430\u044f() {\n" +
          "    \u043d\u0430\u043f\u0435\u0447\u0430\u0442\u0430\u0442\u044c_\u0441\u0442\u0440\u043e\u043a\u0443(\"" +
          привет +
          "\")\n" +
          "    \u0432\u043e\u0437\u0432\u0440\u0430\u0442(0)\n}"
      );
      write(t3);

      write("--- Тест 4: факториал(5) ---");
      const t4 = compileAndRun(
        "\u0444\u0443\u043d\u043a\u0446\u0438\u044f \u0444\u0430\u043a\u0442\u043e\u0440\u0438\u0430\u043b(\u043d) {\n" +
          "    \u0435\u0441\u043b\u0438 (\u043d < 2) { \u0432\u043e\u0437\u0432\u0440\u0430\u0442(1) }\n" +
          "    \u0432\u043e\u0437\u0432\u0440\u0430\u0442(\u043d * \u0444\u0430\u043a\u0442\u043e\u0440\u0438\u0430\u043b(\u043d - 1))\n" +
          "}\n" +
          "\u0444\u0443\u043d\u043a\u0446\u0438\u044f \u0433\u043b\u0430\u0432\u043d\u0430\u044f() { \u0432\u043e\u0437\u0432\u0440\u0430\u0442(\u0444\u0430\u043a\u0442\u043e\u0440\u0438\u0430\u043b(5)) }\n"
      );
      write(t4);

      write("--- ИТОГ ---");
      const text = лог.textContent;
      const ok =
        t1.includes("= 0") &&
        t2.includes("= 5") &&
        t3.includes("WASM!") &&
        t3.includes(привет) &&
        t4.includes("= 120") &&
        !text.includes("Ошибка компиляции") &&
        !text.includes("Ошибка VM");
      if (!ok) {
        write("ОШИБКА: ожидаемый вывод не найден");
        write("t3_has_hello=" + t3.includes(привет));
        write("t3_has_wasm=" + t3.includes("WASM!"));
      } else {
        write("OK WASM-tests passed");
        write("✓ WASM-тесты прошли");
      }
    }

    run().catch((e) => write("ОШИБКА: " + e));
  </script>
</body>
</html>
